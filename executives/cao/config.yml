    port: 3201
    path: sys/dashboard
  automation:
    enabled: true
    port: 3202
    path: sys/automation
  templates:
    enabled: true
    port: 3203
    path: sys/templates
  integrations:
    enabled: true
    port: 3204
    path: sys/integrations

memory:
  enabled: true
  version: v5
  assistant_id: asst_hs4gH6YrhMwNUaf0vb37JANX
  vector_store: vs_cao_cloudette
  isolation: true
  sharing:
    read_access: [ceo, coo]
    write_access: [cao]

