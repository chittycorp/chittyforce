name: Security & Compliance Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM
  workflow_dispatch:

jobs:
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Scan for hardcoded secrets
        run: |
          echo "🔐 Scanning for hardcoded secrets..."
          
          # Check for common secret patterns (excluding wrangler commands)
          if grep -r -E "(password|secret|key|token|api_key)\s*=\s*['\"][^'\"]+['\"]" \
             --include="*.js" --include="*.py" --include="*.yml" --include="*.json" \
             --exclude-dir=node_modules --exclude-dir=.git . | \
             grep -v "wrangler secret" | grep -v "secret:set"; then
            echo "❌ Potential secrets found in code!"
            exit 1
          fi
          
          # Check for API keys
          if grep -r -E "[a-zA-Z0-9]{32,}" \
             --include="*.js" --include="*.py" \
             --exclude-dir=node_modules --exclude-dir=.git . | \
             grep -v -E "(test|example|sample)"; then
            echo "⚠️ Potential API keys detected - please verify"
          fi
          
          echo "✅ No obvious secrets detected"

  permission-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate sync permissions
        run: |
          echo "🔒 Validating sync permissions..."
          
          # Check file permissions
          find executives/ agents/ -type f -name "*.yml" -o -name "*.json" | while read file; do
            perms=$(stat -c "%a" "$file" 2>/dev/null || stat -f "%p" "$file" | cut -c 4-6)
            if [[ "$perms" != "644" ]]; then
              echo "⚠️ Incorrect permissions on $file (should be 644)"
            fi
          done
          
          echo "✅ File permissions validated"

  anti-piracy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify anti-piracy markers
        run: |
          echo "🛡️ Verifying anti-piracy DNA markers..."
          
          # Check for DNA fingerprint files
          if [ ! -f "LICENSE" ]; then
            echo "❌ LICENSE file missing!"
            exit 1
          fi
          
          # Verify license contains protection notice
          if ! grep -q "ChittyAIR Protection License" LICENSE; then
            echo "❌ Invalid license file!"
            exit 1
          fi
          
          echo "✅ Anti-piracy markers verified"

  compliance-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate compliance report
        run: |
          echo "📋 Generating compliance audit report..."
          
          # Check for required security files
          required_files=("LICENSE" "sync-permissions.yml" ".github/workflows/security-scan.yml")
          
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
          done
          
          # Generate audit report
          cat > compliance-report.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "scan_type": "github_action",
            "results": {
              "secrets_scan": "passed",
              "permissions_check": "passed",
              "anti_piracy": "verified",
              "license": "ChittyAIR Protection License"
            }
          }
          EOF
          
          echo "✅ Compliance audit completed"
          
      - name: Upload compliance report
        uses: actions/upload-artifact@v3
        with:
          name: compliance-report
          path: compliance-report.json

  notify-cloudesq:
    needs: [secret-scanning, permission-validation, anti-piracy-check, compliance-audit]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Notify General Counsel
        run: |
          echo "⚖️ Notifying Cloudesq (GC) of security/compliance issues..."
          # This would integrate with actual notification system